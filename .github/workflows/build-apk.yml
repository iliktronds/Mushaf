name: Build Mushaf Al-Noor APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip Android Project
        run: |
          mkdir -p project
          ZIP_FILE=$(find . -maxdepth 3 -name "*.zip" | head -n 1)
          echo "Found zip: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d project
          ls -la project

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build Debug APK
        run: |
          PROJ_DIR=$(dirname "$(find . -name 'settings.gradle.kts' | head -n 1)")
          echo "Building in: $PROJ_DIR"
          mkdir -p "$PROJ_DIR/app/src/main/res/mipmap-anydpi"
          cp "$PROJ_DIR/app/src/main/res/drawable/ic_mushaf_logo.xml" "$PROJ_DIR/app/src/main/res/mipmap-anydpi/ic_launcher.xml"
          cd "$PROJ_DIR"
          gradle assembleDebug --stacktrace
          mkdir -p "$GITHUB_WORKSPACE/output"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/output/app-debug.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mushaf-Al-Noor-APK
          path: output/app-debug.apk
