name: Build Mushaf Al-Noor APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and Unzip Project
        run: |
          mkdir -p build_v2
          ZIP_FILE=$(find . -maxdepth 3 -name "*.zip" | head -n 1)
          echo "Found zip: $ZIP_FILE"
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No .zip file found in repository!"
            ls -la
            exit 1
          fi
          unzip -o "$ZIP_FILE" -d build_v2
          ls -la build_v2

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: |
          GRADLE_DIR=$(dirname "$(find build_v2 -name "settings.gradle*" | head -n 1)")
          echo "Building in: $GRADLE_DIR"
          cd "$GRADLE_DIR"
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mushaf-Al-Noor-v2-APK
          path: build_v2/**/app-debug.apk
